server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los recursos estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los archivos de /assets llevan hash en el nombre: se pueden cachear mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo real la resuelve React Router.
    location / {
        try_files $uri /index.html;
    }

    # index.html no se cachea para que siempre cargue la última versión.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
