name: CD

# Publica las imágenes en GitHub Container Registry.
# Solo en push a main (merge de un PR) y en tags de versión. Nunca en pull requests.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

# Evita dos publicaciones simultáneas de la misma rama o tag.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: taskflow-api
            context: ./api
          - image: taskflow-web
            context: ./web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN lo crea GitHub en cada ejecución; no hay tokens personales en el repo.
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags:
      #   push a main  -> sha-<commit> y latest
      #   tag v1.0.0   -> 1.0.0 y 1.0 (y sha-<commit>)
      - name: Calcular tags y etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo el frontend usa VITE_API_URL (variable del repositorio, no es un secreto).
          build-args: ${{ matrix.image == 'taskflow-web' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
